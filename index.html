<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>我的旅行｜人生足迹</title>


<style>

/* ========================================
   基础
======================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f5f0;

    color: #333;

    line-height: 1.7;
}


a {
    text-decoration: none;
    color: inherit;
}


/* ========================================
   顶部
======================================== */

.hero {

    position: relative;

    padding: 120px 20px 95px;

    text-align: center;

    background-image: url('images/hero-road.jpg');

    background-size: cover;

    background-position: center 45%;

    color: #fff;

}


.hero::before {

    content: '';

    position: absolute;

    inset: 0;

    background: linear-gradient(180deg, rgba(25,30,40,.28) 0%, rgba(25,30,40,.50) 100%);

}


.hero h1,

.hero p {

    position: relative;

    z-index: 1;

}


.hero h1 {

    margin: 0 0 10px;

    font-size: 38px;

    font-weight: 500;

    letter-spacing: 2px;

    text-shadow: 0 2px 14px rgba(0,0,0,.45);
}


.hero p {

    margin: 0;

    color: rgba(255,255,255,.88);

    font-size: 16px;

    text-shadow: 0 1px 8px rgba(0,0,0,.35);
}


/* ========================================
   主体
======================================== */

.container {

    max-width: 1000px;

    margin: 0 auto;

    padding: 55px 20px 80px;
}


.section-title {

    margin: 0 0 10px;

    font-size: 27px;

    font-weight: 500;
}


.section-intro {

    margin: 0 0 35px;

    color: #777;

    font-size: 15px;
}


/* ========================================
   旅行卡片区域
======================================== */

.trip-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 28px;
}


/* ========================================
   单张旅行卡片
======================================== */

.trip-card {

    overflow: hidden;

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.06);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}


.trip-card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.10);
}


/* ========================================
   旅行图片
======================================== */

.trip-image {

    width: 100%;

    height: 260px;

    background-color: #ddd;

    background-position: center;

    background-size: cover;

    background-repeat: no-repeat;
}


/* ========================================
   卡片内容
======================================== */

.trip-content {

    padding: 25px 25px 27px;
}


.trip-year {

    margin-bottom: 5px;

    color: #999;

    font-size: 14px;

    letter-spacing: 1px;
}


.trip-content h2 {

    margin: 0 0 6px;

    font-size: 26px;

    font-weight: 500;
}


.trip-destination {

    margin: 0 0 12px;

    color: #777;

    font-size: 15px;
}


.trip-description {
    margin: 0 0 22px;
    color: #666;
    font-size: 15px;
}


/* ========================================
   旅行地点
======================================== */

.trip-places {
    margin: 0 0 22px;
    color: #6f5c46;
    font-size: 14px;
}


.trip-places summary {
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
}


.trip-places summary::-webkit-details-marker {
    display: none;
}


.trip-places summary::after {
    content: "＋";
    font-size: 13px;
    color: #999;
}


.trip-places[open] summary::after {
    content: "−";
}


.trip-place-list {
    margin-top: 12px;
    padding: 12px 15px;
    background: #f7f4ee;
    border-radius: 8px;
}


.trip-place-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    color: #666;
}


.place-dot {
    color: #a58b6b;
    font-size: 8px;
}

/* ========================================
   两个入口
======================================== */

.trip-actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


.trip-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 42px;

    padding: 8px 15px;

    border-radius: 8px;

    font-size: 14px;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


/* 攻略 */

.guide-button {

    background: #8b7355;

    color: #fff;
}


.guide-button:hover {

    background: #756044;

    transform: translateY(-1px);
}


/* 回忆 */

.memory-button {

    background: #eee9df;

    color: #6f5c46;
}


.memory-button:hover {

    background: #e3dccf;

    transform: translateY(-1px);
}


/* 没有攻略 */

.disabled-button {

    background: #f1f1f1;

    color: #aaa;

    cursor: default;
}


/* ========================================
   地图区域
======================================== */

.map-section {

    margin-top: 75px;
}


.map-stats {

    display: flex;

    gap: 18px;

    flex-wrap: wrap;

    margin-bottom: 18px;

    color: #6f5c46;

    font-size: 15px;

    font-weight: 500;

}


.year-filter {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 18px;

}


.year-btn {

    display: inline-flex;

    align-items: center;

    min-height: 36px;

    padding: 6px 16px;

    border: none;

    border-radius: 8px;

    background: #eee9df;

    color: #6f5c46;

    font-size: 14px;

    font-family: inherit;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


.year-btn:hover {

    background: #e3dccf;

    transform: translateY(-1px);

}


.year-btn.active {

    background: #8b7355;

    color: #fff;

}


.map-box {

    min-height: 320px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #e9e5dc;

    border-radius: 14px;

    color: #999;

    text-align: center;
}


.map-box-inner {

    padding: 30px;
}


.map-icon {

    margin-bottom: 10px;

    font-size: 42px;
}


.map-title {

    margin-bottom: 5px;

    color: #777;

    font-size: 20px;
}


.map-description {

    margin: 0;

    color: #999;

    font-size: 14px;
}


/* ========================================
   页脚
======================================== */

.footer {

    padding: 35px 20px;

    text-align: center;

    color: #999;

    font-size: 13px;
}


/* ========================================
   手机
======================================== */

@media (max-width: 700px) {

    .hero {

        padding: 55px 20px 45px;
    }


    .hero h1 {

        font-size: 30px;
    }


    .container {

        padding-top: 40px;
    }


    .trip-grid {

        grid-template-columns: 1fr;
    }


    .trip-image {

        height: 230px;
    }


    .trip-actions {

        flex-direction: column;
    }


    .trip-button {

        width: 100%;
    }

}


/* ===== TRAVEL BANK 世界地图 1.0 ===== */
#worldMap{overflow:hidden;background:#102b3a;}
.travel-map-wrap{position:relative;overflow:hidden;border-radius:18px;
  background:radial-gradient(circle at 50% 45%, #21495b 0%, #102b3a 55%, #071c29 100%);
  box-shadow:0 18px 50px rgba(20,40,50,.18);}
.travel-glow-marker{position:relative;width:18px;height:18px;}
.travel-glow-marker::before{content:"";position:absolute;inset:-8px;border-radius:50%;
  background:rgba(255,190,82,.16);animation:travelPulse 2.4s ease-out infinite;}
.travel-glow-marker::after{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;
  border-radius:50%;background:#ffd36a;border:2px solid rgba(255,255,255,.95);
  box-shadow:0 0 8px rgba(255,211,106,.95),0 0 20px rgba(255,183,61,.65);}
@keyframes travelPulse{0%{transform:scale(.45);opacity:.8;}70%{transform:scale(1.25);opacity:0;}100%{transform:scale(1.25);opacity:0;}}
.travel-passed-marker::after{background:#d8d4ca;box-shadow:0 0 7px rgba(255,255,255,.45);}
.travel-passed-marker::before{display:none;}
.travel-route{stroke:#f5c96b;stroke-width:1.4;stroke-dasharray:6 9;opacity:.55;animation:routeMove 18s linear infinite;}
@keyframes routeMove{to{stroke-dashoffset:-120;}}
.map-legend{position:absolute;left:18px;bottom:18px;z-index:500;padding:9px 14px;border-radius:999px;
  background:rgba(8,28,40,.72);color:rgba(255,255,255,.9);backdrop-filter:blur(8px);font-size:12px;}
.map-legend span{margin-right:12px;}
.map-legend span:last-child{margin-right:0;}
.legend-dot{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;
  vertical-align:middle;background:#ffd36a;box-shadow:0 0 8px #ffd36a;}
.legend-passed{background:#d8d4ca;box-shadow:none;}
.map-loading{position:absolute;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center, rgba(31,72,89,.95), rgba(7,28,41,.98));
  color:rgba(255,255,255,.85);font-size:14px;transition:opacity .5s ease;}
.map-loading.hide{opacity:0;pointer-events:none;}


/* ===== 年表索引（全部足迹模式） ===== */
#yearIndex{display:none;}
#yearIndex.on{display:block;}
.year-row{margin-bottom:26px;}
.year-row .yr-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.year-row .yr-year{font-size:24px;font-weight:500;color:#3a352f;letter-spacing:1px;}
.year-row .yr-line{flex:1;height:1px;background:#d8d2c4;}
.year-row .yr-count{font-size:13px;color:#b8ad9a;}
.year-row .yr-dest{font-size:15px;color:#555;}
.year-row .yr-dest span{margin-right:14px;white-space:nowrap;}

</style>

<!-- ========================================
     自动生成旅行卡片
======================================== -->

<script>

const tripGrid =
    document.getElementById("tripGrid");


/* ----------------------------------------
   places 安全兜底：
   places.js 加载失败时不让页面崩掉
---------------------------------------- */

const safePlaces =
    (
        typeof PLACE_BANK !== "undefined" &&
        Array.isArray(PLACE_BANK)
    )
        ? PLACE_BANK
        : [];


/* ----------------------------------------
   检查数据是否成功加载
---------------------------------------- */

if (
    typeof TRIP_BANK === "undefined" ||
    !Array.isArray(TRIP_BANK)
) {

    tripGrid.innerHTML = `

        <div style="
            grid-column: 1 / -1;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            text-align: center;
            color: #999;
        ">

            暂时没有读取到旅行数据。

            <br><br>

            请检查：

            <br>

            <strong>
                data/trips/ 目录下的行程文件
            </strong>

            请检查旅行数据文件是否正常加载。

        </div>

    `;

}


/* ----------------------------------------
   自动生成旅行卡片
---------------------------------------- */

else {

    /* 按年份降序排列（新的在前），同年按开始日期降序 */

        TRIP_BANK.sort((a, b) =>

            (b.year - a.year) ||

            String(b.startDate || "").localeCompare(String(a.startDate || ""))

        );


        var lastYear = null;

        TRIP_BANK.forEach(trip => {

            if(trip.year !== lastYear){

                lastYear = trip.year;

                var yDiv = document.createElement("div");

                yDiv.style.cssText = "grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:26px 4px 2px;";

                yDiv.innerHTML = '<span style="font-size:22px;font-weight:500;color:#6f5c46;letter-spacing:1px">' + trip.year + '</span>' +

                    '<span style="flex:1;height:1px;background:#e3dccf"></span>' +

                    '<span style="font-size:12px;color:#b8ad9a">' + (TRIP_BANK.filter(function(t){return t.year === trip.year;}).length) + ' 次旅行</span>';

                yDiv.dataset.year = trip.year;

                tripGrid.appendChild(yDiv);

            }



        /* 创建卡片 */

        const card =
            document.createElement("article");


        card.className =
            "trip-card";

        card.dataset.year = trip.year;


        /* --------------------------------
           生成攻略按钮
        -------------------------------- */

        let guideButton = "";


        if (trip.guidePage) {

            guideButton = `

                <a
                    class="trip-button guide-button"
                    href="${trip.guidePage}"
                >
                    📖 旅游攻略
                </a>

            `;

        } else {

            guideButton = `

                <span
                    class="trip-button disabled-button"
                >
                    📖 攻略整理中
                </span>

            `;

        }


        /* --------------------------------
           生成回忆按钮
        -------------------------------- */

        let memoryButton = "";


        if (trip.memoryPage) {

            memoryButton = `

                <a
                    class="trip-button memory-button"
                    href="${trip.memoryPage}"
                >
                    🔐 我的回忆
                </a>

            `;

        }


        /* --------------------------------
           生成整个卡片
        -------------------------------- */

        card.innerHTML = `

            <div
                class="trip-image"
                style="
                    background-image:
                    url('${trip.cover}');
                "
            ></div>


            <div class="trip-content">


                <div class="trip-year">

                    ${trip.year}

                </div>


                <h2>

                    ${trip.title}

                </h2>


                <p class="trip-destination">

                    ${trip.destination}

                </p>


                <p class="trip-description">

                    ${trip.description || ""}

                </p>
<details class="trip-places">

    <summary>
        📍 ${
            safePlaces.filter(
                place => place.tripId === trip.id
            ).length
        } 个地点
    </summary>

    <div class="trip-place-list">

        ${
            safePlaces
                .filter(
                    place => place.tripId === trip.id
                )
                .map(
                    place => `
                        <div class="trip-place-item">
                            <span class="place-dot">●</span>
                            <span>${place.city}</span>
                        </div>
                    `
                )
                .join("")
        }

    </div>

</details>

                <div class="trip-actions">

                    ${guideButton}

                    ${memoryButton}

                </div>


            </div>

        `;


        tripGrid.appendChild(card);

    });

}



/* ===== 年表索引（全部足迹模式） ===== */

var FLAG = {
  "中国":"🇨🇳","日本":"🇯🇵","俄罗斯":"🇷🇺","意大利":"🇮🇹","梵蒂冈":"🇻🇦",
  "埃及":"🇪🇬","阿联酋":"🇦🇪","新西兰":"🇳🇿","荷兰":"🇳🇱","克罗地亚":"🇭🇷",
  "波黑":"🇧🇦","黑山":"🇲🇪","以色列":"🇮🇱","巴勒斯坦":"🇵🇸","约旦":"🇯🇴",
  "英国":"🇬🇧","尼泊尔":"🇳🇵","越南":"🇻🇳","柬埔寨":"🇰🇭"
};

function renderYearIndex(){
  var byYear = {};
  TRIP_BANK.forEach(function(t){
    if(!byYear[t.year]) byYear[t.year] = [];
    byYear[t.year].push(t);
  });
  var years = Object.keys(byYear).sort(function(a,b){ return b - a; });
  var html = '<div style="font-size:19px;font-weight:600;color:#3a352f;margin-bottom:22px;">我的旅行人生</div>' +
             '<div style="height:1px;background:#3a352f;margin-bottom:26px;"></div>';
  years.forEach(function(y){
    var trips = byYear[y];
    var dests = [];
    trips.forEach(function(t){
      var flag = FLAG[t.country] || "🌍";
      var name = t.country === "中国" ? t.destination : t.country;
      var item = flag + " " + name;
      if(dests.indexOf(item) < 0) dests.push(item);
    });
    html += '<div class="year-row">' +
      '<div class="yr-head"><span class="yr-year">' + y + '</span>' +
      '<span class="yr-line"></span>' +
      '<span class="yr-count">' + trips.length + ' 次旅行</span></div>' +
      '<div class="yr-dest"><span>' + dests.join('</span><span>') + '</span></div>' +
      '</div>';
  });
  var el = document.getElementById("yearIndex");
  el.innerHTML = html +
      '<div style="text-align:center;margin:34px 0 6px"><a href="guide/wishlist.html" style="display:inline-block;color:#c8a24a;font-size:14px;text-decoration:none;border:1px solid rgba(200,162,74,.55);padding:9px 22px;border-radius:22px;letter-spacing:2px">⭐ 想去清单 · 一路走</a><div style="font-size:12px;color:#8a7e6a;margin-top:8px">有梦想就有动力 · 一一去实现 · 人生很长 · 一路走</div></div>';
}

renderYearIndex();

function showYearIndex(show){
  var yi = document.getElementById("yearIndex");
  var tg = document.getElementById("tripGrid");
  if(yi) yi.className = show ? "on" : "";
  if(tg) tg.style.display = show ? "none" : "";
}


/* 年份联动：地图按钮 → 卡片同步过滤 */

window.filterCardsByYear = function(value){

    showYearIndex(value === "all");

    var children = tripGrid.children;

    for(var i = 0; i < children.length; i++){

        var el = children[i];

        var show = value === "all" || String(el.dataset.year) === String(value);

        el.style.display = show ? "" : "none";

    }

};

</script>

<!-- 点亮地图 1.1 懒加载版 · 设计:ChatGPT 施工:Leo 融合:暗色底图+类型修复+统计行 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  if(typeof L === "undefined"){ console.log("Leaflet 没有加载"); return; }
  var safePlaces = (typeof PLACE_BANK !== "undefined" && Array.isArray(PLACE_BANK)) ? PLACE_BANK : [];
  var mapStarted = false;
  var yearMap = {};
  if(typeof TRIP_BANK !== "undefined" && Array.isArray(TRIP_BANK)){
    TRIP_BANK.forEach(function(trip){ yearMap[trip.id] = trip.year; });
  }
  var markers = [];

  function updateStats(year){
    var list = markers.filter(function(m){ return year === "all" || String(m.year) === String(year); });
    var lit = list.filter(function(m){ return !m.passed; });
    var regions = {}, countries = {};
    lit.forEach(function(m){
      regions[m.place.country + m.place.region] = 1;
      countries[m.place.country] = 1;
    });
    var tripText = "";
    if(typeof TRIP_BANK !== "undefined" && year !== "all"){
      var n = TRIP_BANK.filter(function(t){ return String(t.year) === String(year); }).length;
      tripText = '<span>🧭 ' + n + ' 次旅行</span>';
    }
    var label = year === "all" ? "全部足迹" : year + " 年";
    var el = document.getElementById("mapStats");
    if(el){
      el.innerHTML = '<span><b>' + label + '</b></span>' + tripText +
        '<span>🌍 ' + Object.keys(countries).length + ' 国</span>' +
        '<span>🗺️ ' + Object.keys(regions).length + ' 个省级地区</span>' +
        '<span>📍 ' + lit.length + ' 城点亮</span>';
    }
  }

  function startWorldMap(){
    if(mapStarted) return;
    mapStarted = true;

    var worldMap = L.map("worldMap", {
  scrollWheelZoom: true,
  zoomControl: true,
  zoomSnap: 0.5,
  zoomDelta: 0.5,
  wheelPxPerZoomLevel: 160,
  updateWhenIdle: true,
  updateWhenZooming: false,
  preferCanvas: true,

  // 最小缩放，不允许无限缩小
  minZoom: 2,

  // 限制地图只能停留在一个世界范围内
  maxBounds: [
    [-85, -180],
    [85, 180]
  ],

  // 到达边界后不能继续拖出去
  maxBoundsViscosity: 1.0

}).fitBounds(
  [
    [-55, -180],
    [75, 180]
  ],
  {
    padding: [10, 10]
  }
);

   L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  {
    attribution: "© Esri · © OpenStreetMap contributors",
    minZoom: 2,
    maxZoom: 10,
    maxNativeZoom: 7,

    // 禁止世界横向无限重复
    noWrap: true,

    keepBuffer: 2,
    updateWhenIdle: true,
    updateWhenZooming: false
  }
).addTo(worldMap);

  /* ===== 省市县分级标注系统（2026-10-06） ===== */
  var PROV = [
    ["黑龙江",45.8,126.5],["吉林",43.9,125.3],["辽宁",41.8,123.4],
    ["北京",39.9,116.4],["天津",39.1,117.2],["河北",38.0,114.5],
    ["山西",37.9,112.5],["内蒙古",40.8,111.7],["山东",36.7,117.0],
    ["河南",34.8,113.7],["江苏",32.1,118.8],["上海",31.2,121.5],
    ["浙江",30.3,120.2],["安徽",31.8,117.3],["湖北",30.6,114.3],
    ["湖南",28.2,113.0],["江西",28.7,115.9],["福建",26.1,119.3],
    ["广东",23.1,113.3],["广西",22.8,108.3],["海南",20.0,110.3],
    ["贵州",26.6,106.7],["云南",25.0,102.7],["四川",30.7,104.1],
    ["重庆",29.6,106.5],["西藏",29.7,91.1],["陕西",34.3,108.9],
    ["甘肃",36.1,103.8],["宁夏",38.5,106.3],["青海",36.6,101.8],
    ["新疆",43.8,87.6],["台湾",25.0,121.5],["香港",22.3,114.2],["澳门",22.2,113.5]
  ];
  var provLayer = L.layerGroup();
  PROV.forEach(function(p){
    provLayer.addLayer(L.marker([p[1], p[2]], {
      icon: L.divIcon({className:"prov-label", html:p[0], iconSize:null}),
      interactive:false, keyboard:false
    }));
  });
  var cityLabelLayer = L.layerGroup();
  (typeof PLACE_BANK !== "undefined" ? PLACE_BANK : []).forEach(function(p){
    if(p.lat && p.city && p.status !== "passed"){
      cityLabelLayer.addLayer(L.marker([p.lat, p.lng], {
        icon: L.divIcon({className:"city-label", html:"<span>"+p.city+"</span>", iconSize:null}),
        interactive:false, keyboard:false
      }));
    }
  });
  var provBorder = null;
  fetch("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json")
    .then(function(r){ return r.json(); })
    .then(function(g){
      provBorder = L.geoJSON(g, {style:{color:"#c8a24a", weight:0.8, opacity:0.4, fill:false}, interactive:false});
      syncLabels();
    })
    .catch(function(){ syncLabels(); });
  function syncLabels(){
    var z = worldMap.getZoom();
    if(z >= 5 && z < 7){
      if(!worldMap.hasLayer(provLayer)) provLayer.addTo(worldMap);
      if(provBorder && !worldMap.hasLayer(provBorder)) provBorder.addTo(worldMap);
    } else {
      if(worldMap.hasLayer(provLayer)) worldMap.removeLayer(provLayer);
      if(provBorder && worldMap.hasLayer(provBorder)) worldMap.removeLayer(provBorder);
    }
    if(z >= 6){
      if(!worldMap.hasLayer(cityLabelLayer)) cityLabelLayer.addTo(worldMap);
    } else {
      if(worldMap.hasLayer(cityLabelLayer)) worldMap.removeLayer(cityLabelLayer);
    }
  }
  worldMap.on("zoomend", syncLabels);
  worldMap.whenReady(function(){ setTimeout(syncLabels, 300); });

  /* ===== 分级标注样式 ===== */
  var labelStyle = document.createElement("style");
  labelStyle.textContent = [
    ".prov-label{font-size:12px;color:rgba(200,162,74,.75);letter-spacing:3px;",
    "  white-space:nowrap;text-shadow:0 0 4px rgba(0,0,0,.9);transform:translate(-50%,-50%);",
    "  pointer-events:none;font-family:-apple-system,'PingFang SC',sans-serif}",
    ".city-label{font-size:11px;color:rgba(255,250,240,.92);white-space:nowrap;",
    "  text-shadow:0 0 5px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9);transform:translate(-50%,-50%);",
    "  pointer-events:none;font-family:-apple-system,'PingFang SC',sans-serif}",
    ".city-label span{display:block;transform:translateY(-14px)}"
  ].join("");
  document.head.appendChild(labelStyle);

  /* ===== 想去清单 · 金色脉冲层（2026-10-06） ===== */
  var wishLayer = L.layerGroup();
  (typeof WISH_BANK !== "undefined" ? WISH_BANK : []).forEach(function(w){
    var m = L.marker([w.lat, w.lng], {
      icon: L.divIcon({className:"wish-wrap", html:"<div class=\"wish-pulse\"><div class=\"wish-dot\"></div></div><div class=\"wish-label\">"+w.name+"</div>", iconSize:null}),
      interactive:true
    });
    if(w.note) m.bindTooltip(w.name + " · " + w.note, {direction:"top", offset:[0,-10], className:"wish-tip"});
    wishLayer.addLayer(m);
  });
  wishLayer.addTo(worldMap);
  var wishCss = document.createElement("style");
  wishCss.textContent = [
    ".wish-pulse{width:12px;height:12px;transform:translate(-50%,-50%)}",
    ".wish-dot{width:9px;height:9px;border-radius:50%;background:#c8a24a;",
    "  box-shadow:0 0 0 0 rgba(200,162,74,.75);animation:wishPulse 2.6s infinite}",
    "@keyframes wishPulse{0%{box-shadow:0 0 0 0 rgba(200,162,74,.65)}",
    "  70%{box-shadow:0 0 0 16px rgba(200,162,74,0)}100%{box-shadow:0 0 0 0 rgba(200,162,74,0)}}",
    ".wish-label{font-size:11px;color:rgba(255,250,240,.5);white-space:nowrap;",
    "  text-shadow:0 0 4px rgba(0,0,0,.95);transform:translate(-50%,8px);",
    "  pointer-events:none;font-family:-apple-system,'PingFang SC',sans-serif}",
    ".wish-tip{background:#2f2a24;color:#e8dcc8;border:1px solid #c8a24a;"
  ].join("");
  document.head.appendChild(wishCss);

    var groupedTrips = {};
    safePlaces.forEach(function(place){
      if(place.lat === undefined || place.lng === undefined) return;
      var passed = place.status === "passed";
      var year = yearMap[place.tripId];
      var cls = passed ? "travel-glow-marker travel-passed-marker" : "travel-glow-marker";
      var marker = L.marker([place.lat, place.lng], {
        icon: L.divIcon({ className: "", html: '<div class="' + cls + '"></div>', iconSize: [18,18], iconAnchor: [9,9] })
      });
      var sites = place.sites && place.sites.length
        ? '<div style="margin-top:6px;color:#f0d9a8;">📍 ' + place.sites.join(" · ") + '</div>' : "";
      var note = place.note ? '<div style="margin-top:5px;color:#9fb3bd;font-size:12px;">' + place.note + '</div>' : "";
      var yearText = year ? '<span style="color:#9fb3bd;font-size:12px;">· ' + year + '</span>' : "";
      marker.bindPopup(
        '<div style="min-width:170px;font-size:14px;">' +
        '<strong style="font-size:17px;color:#222;">' + place.city + '</strong>' +
        (passed ? '<span style="color:#aaa;font-size:12px;"> 路过</span>' : "") +
        '<div style="color:#777;font-size:12px;margin-top:3px;">' + place.country + ' · ' + (place.region || "") + yearText + '</div>' +
        sites + note + '</div>'
      );
      marker.addTo(worldMap);
      markers.push({ marker: marker, place: place, year: year, passed: passed });
      if(place.tripId){
        if(!groupedTrips[place.tripId]) groupedTrips[place.tripId] = [];
        groupedTrips[place.tripId].push(place);
      }
    });

    Object.keys(groupedTrips).forEach(function(tid){
      var pts = groupedTrips[tid];
      if(pts.length < 2) return;
      L.polyline(pts.map(function(p){ return [p.lat, p.lng]; }), {
        className: "travel-route", color: "#f5c96b", weight: 1.3,
        opacity: .45, dashArray: "6 9", interactive: false
      }).addTo(worldMap);
    });

    var filter = document.getElementById("yearFilter");
    if(filter){
      var years = [];
      Object.keys(yearMap).forEach(function(k){
        var y = yearMap[k];
        if(years.indexOf(y) < 0) years.push(y);
      });
      years.sort(function(a,b){ return b - a; });
      var buttons = [];
      function createButton(label, value){
        var button = document.createElement("button");
        button.className = "year-btn";
        button.textContent = label;
        button.dataset.value = value;
        filter.appendChild(button);
        buttons.push(button);
        return button;
      }
      createButton("全部足迹", "all");
      years.forEach(function(y){ createButton(String(y), y); });
      function selectYear(value){
        var points = [];
        markers.forEach(function(item){
          var active = value === "all" || String(item.year) === String(value);
          var element = item.marker.getElement();
          if(element) element.style.opacity = active ? "1" : ".18";
          if(active) points.push([item.place.lat, item.place.lng]);
        });
        buttons.forEach(function(button){
          button.classList.toggle("active", String(button.dataset.value) === String(value));
        });
     updateStats(value);  if(window.filterCardsByYear) {   window.filterCardsByYear(value); }  if(value !== "all" && points.length) {    worldMap.flyToBounds(     L.latLngBounds(points).pad(.35),     { duration: 1 }   );  } else {    worldMap.fitBounds(     [       [-55, -180],       [75, 180]     ],     {       padding: [10, 10],       duration: 1     }   );  }  
      }
      buttons.forEach(function(button){
        button.addEventListener("click", function(){ selectYear(button.dataset.value); });
      });
      selectYear("all");
    } else {
      updateStats("all");
    }

    setTimeout(function(){ worldMap.invalidateSize(); }, 300);

    var loading = document.getElementById("mapLoading");
    setTimeout(function(){
      if(loading) loading.classList.add("hide");
    }, 500);
  }

  var mapBox = document.getElementById("worldMap");
  if(!mapBox){ console.log("找不到 worldMap"); return; }

  if("IntersectionObserver" in window){
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          startWorldMap();
          observer.disconnect();
        }
      });
    }, { root: null, rootMargin: "500px 0px", threshold: .01 });
    observer.observe(mapBox);
  } else {
    startWorldMap();
  }
})();
</script>

</body>

</html>
